<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Documentação — Locadora de Veículos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Documentação técnica do sistema Locadora de Veículos: arquitetura, módulos, API, front-end, serviço de ML, segurança, testes e métricas.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    /* Inter variável servida de public/fonts: o url() relativo segue o <base href>, então vale em qualquer subcaminho. */
    @font-face {
      font-family: "Inter Variable"; font-style: normal; font-display: swap; font-weight: 100 900;
      src: url("fonts/inter-latin-ext-wght-normal.woff2") format("woff2-variations");
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: "Inter Variable"; font-style: normal; font-display: swap; font-weight: 100 900;
      src: url("fonts/inter-latin-wght-normal.woff2") format("woff2-variations");
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
  </style>
  <script>
    // Aplica o tema salvo (ou o do sistema) antes da primeira pintura, para não piscar claro/escuro.
    (function () {
      try {
        var salvo = localStorage.getItem('tema');
        var escuro = salvo ? salvo === 'escuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (escuro) document.documentElement.classList.add('dark');
      } catch (e) { /* armazenamento indisponível: segue o tema claro */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
