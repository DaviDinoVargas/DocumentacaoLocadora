name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# O Pages precisa de permissão para ler o repositório, publicar e emitir o token de identidade do deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; uma nova substitui a que ainda não terminou, mas nunca cancela uma em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Subcaminho do repositório no Pages: https://<usuario>.github.io/DocumentacaoLocadora/
  BASE_HREF: /${{ github.event.repository.name }}/

jobs:
  construir:
    name: Testar e construir
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Rodar os testes
        run: npm test

      - name: Construir para o GitHub Pages
        run: npx ng build --base-href "$BASE_HREF"

      - name: Preparar 404.html (rotas da SPA) e .nojekyll
        run: node tools/pos-build.mjs dist/documentacao-locadora/browser "$BASE_HREF"

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar o artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/documentacao-locadora/browser

  publicar:
    name: Publicar
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
